<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Settings shortcuts verification</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import SettingsModal from '/src/components/overlays/SettingsModal.jsx';
      import useConfigStore from '/src/store/useConfigStore.js';
      import i18n from '/src/i18n/index.js';
      import '/src/assets/styles/index.scss';

      // 断言依赖固定文案，因此显式锁定语言。
      await i18n.changeLanguage('zh');

      const root = createRoot(document.getElementById('root'));
      const showDocs = new URLSearchParams(location.search).has('plugin-docs');
      const EditorContent = showDocs ? (await import('/src/components/layout/content/EditorContent.jsx')).default : null;
      const editorStore = showDocs ? (await import('/src/store/useEditorStore.js')).default : null;
      function DocsHarness() {
        const [open, setOpen] = React.useState(true);
        return React.createElement(React.Fragment, null,
          React.createElement('button', { onClick: () => setOpen(true) }, 'Open settings'),
          React.createElement(EditorContent),
          React.createElement(SettingsModal, { open, onClose: () => setOpen(false) }));
      }
      window.trial = {
        render() {
          root.render(showDocs ? React.createElement(DocsHarness)
            : React.createElement(SettingsModal, { open: true, onClose: () => {} }));
        },
        docsTabs: () => editorStore?.getState().tabs.filter((tab) => tab.builtin === 'pluginDocs'),
        resetHotkeys: () => useConfigStore.getState().resetHotkeys(),
        hotkeys: () => useConfigStore.getState().hotkeys,
      };
      window.trial.render();
    </script>
  </body>
</html>
