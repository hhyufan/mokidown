<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>MokiDown</title>

    <!--
      Critical styles — inlined so the very first paint of the WebView is the
      user's persisted theme color, not the default white. This eliminates the
      "white flash" during WebView2 / WKWebView / WebKitGTK startup before
      our app's CSS bundle is parsed.
    -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      html { background: #f5f5f7; }
      html[data-theme='dark'] { background: #121212; }
      #root { height: 100%; }

      #moki-startup-recovery {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 1000;
        width: min(380px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 16px;
        border: 1px solid #b8bac1;
        border-radius: 12px;
        background: #fff;
        color: #26272a;
        box-shadow: 0 4px 20px #0002;
        font: 14px/1.5 system-ui, sans-serif;
      }
      html[data-theme='dark'] #moki-startup-recovery { background: #242426; color: #f5f5f7; border-color: #555; }
      #moki-startup-recovery h2 { margin: 0; font-size: 16px; }
      #moki-startup-recovery button { margin-right: 8px; padding: 4px 8px; cursor: pointer; }

    </style>

    <!-- The native window is visible from creation, so startup errors are visible too. -->
    <script>
      (function () {
        var pending = [];
        var ready = false;
        var timer;
        var card;
        var bootstrap = window.__mokiRuntimeLogs = {
          pending: pending,
          accept: null,
          ready: function () {
            ready = true;
            clearTimeout(timer);
            if (card) card.remove();
            pending.length = 0;
          }
        };

        function exportStartupLogs() {
          var blob = new Blob([JSON.stringify({ schemaVersion: 1, entries: pending }, null, 2)], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = url;
          link.download = 'mokidown-startup-errors.json';
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }

        function showStartupRecovery() {
          if (ready || card || !document.body) return;
          var chinese = (navigator.language || '').toLowerCase().indexOf('zh') === 0;
          card = document.createElement('aside');
          card.id = 'moki-startup-recovery';
          card.setAttribute('role', 'status');
          var heading = document.createElement('h2');
          heading.textContent = chinese ? 'MokiDown 启动遇到问题' : 'MokiDown had a startup problem';
          var message = document.createElement('p');
          message.textContent = chinese ? '可以重试，或导出本次启动日志。' : 'Retry or export the startup log.';
          var reload = document.createElement('button');
          reload.textContent = chinese ? '重新加载' : 'Reload';
          reload.addEventListener('click', function () { location.reload(); });
          var download = document.createElement('button');
          download.textContent = chinese ? '导出错误日志' : 'Export error log';
          download.addEventListener('click', exportStartupLogs);
          card.append(heading, message, reload, download);
          document.body.appendChild(card);
        }

        function capture(message, error) {
          var name = error && error.name;
          var text = String(message || 'Unknown error');
          if (name === 'Canceled' || name === 'CancellationError' || name === 'AbortError' ||
              /^(canceled|cancelled|aborted)$/i.test(text)) return;
          var entry = {
            timestamp: Date.now(), level: 'error', source: ready ? 'WebView' : 'Startup',
            message: redact(text, 4096), stack: redact(error && error.stack, 10000)
          };
          if (!ready || !bootstrap.accept) {
            pending.push(entry);
            if (pending.length > 100) pending.shift();
          }
          if (bootstrap.accept) bootstrap.accept(entry);
          if (!ready) {
            if (document.body) showStartupRecovery();
            else document.addEventListener('DOMContentLoaded', showStartupRecovery, { once: true });
          }
        }

        function redact(value, limit) {
          return String(value || '').slice(0, limit)
            .replace(/\b(Bearer\s+)[^\s,;"']+/gi, '$1[redacted]')
            .replace(/([?&](?:access_token|refresh_token|token|api[_-]?key|password)=)[^&#\s]+/gi, '$1[redacted]');
        }

        window.addEventListener('error', function (event) {
          if (event.message || event.error) capture(event.error?.message || event.message, event.error);
          else if (event.target && event.target.tagName === 'SCRIPT') capture('Could not load application script.');
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          capture(reason && reason.message || reason, reason);
        });
        timer = setTimeout(function () {
          if (!ready) capture('Application did not finish starting within 30 seconds.');
        }, 30000);


        // 1. Apply persisted theme to <html> so the inline CSS picks it up.
        try {
          var raw = localStorage.getItem('mokidown-theme');
          // 品牌更名（MDE → MokiDown）后的兼容读取：新键还没有值时回退到旧键，
          // 避免首屏先按系统主题闪一下；真正的复制迁移在
          // src/utils/storageMigration.js，由 src/main.jsx 最先执行。
          if (raw === null) raw = localStorage.getItem('mde-theme');
          var theme = raw && JSON.parse(raw)?.state?.theme;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (_) { /* noop — fall back to light */ }

      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
